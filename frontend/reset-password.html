<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EventSync - Reset Password</title>

    <link rel="stylesheet" href="css/reset-password.css">
</head>

<body>

    <div class="login-container">

        <!-- LEFT PANEL -->
        <div class="login-left">

            <div class="left-content">

                <div class="logo">
                    ES
                </div>

                <h1>EventSync</h1>

                <p>
                    Centralized platform for seamless corporate
                    event coordination, venue discovery and
                    planning experience.
                </p>

                <div class="feature-list">

                    <div class="feature-item">
                        ✓ Secure Account Retrieval
                    </div>

                    <div class="feature-item">
                        ✓ Dynamic Password Resets
                    </div>

                    <div class="feature-item">
                        ✓ Two-way Data Security
                    </div>

                </div>

            </div>

        </div>

        <!-- RIGHT PANEL -->
        <div class="login-right">

            <div class="login-card">

                <h2>New Password</h2>

                <p class="subtitle">
                    Enter your new password below.
                </p>

                <form id="resetForm">

                    <div class="input-group">

                        <label for="password">New Password</label>

                        <div class="password-wrapper">

                            <input
                                type="password"
                                id="password"
                                placeholder="Enter new password"
                                required>

                            <button
                                type="button"
                                id="togglePassword"
                                class="password-toggle-btn">

                                <svg class="eye-open"
                                    xmlns="http://www.w3.org/2000/svg"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2">

                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>

                                </svg>

                                <svg class="eye-closed"
                                    xmlns="http://www.w3.org/2000/svg"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    style="display:none;">

                                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"></path>
                                    <line x1="1" y1="1" x2="23" y2="23"></line>

                                </svg>

                            </button>

                        </div>

                    </div>

                    <div class="input-group">

                        <label for="confirmPassword">Confirm Password</label>

                        <div class="password-wrapper">

                            <input
                                type="password"
                                id="confirmPassword"
                                placeholder="Confirm new password"
                                required>

                            <button
                                type="button"
                                id="toggleConfirmPassword"
                                class="password-toggle-btn">

                                <svg class="eye-open"
                                    xmlns="http://www.w3.org/2000/svg"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2">

                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>

                                </svg>

                                <svg class="eye-closed"
                                    xmlns="http://www.w3.org/2000/svg"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    style="display:none;">

                                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"></path>
                                    <line x1="1" y1="1" x2="23" y2="23"></line>

                                </svg>

                            </button>

                        </div>

                    </div>

                    <button type="submit">
                        Reset Password
                    </button>

                </form>

                <div class="bottom-text">

                    Back to login?
                    <a href="login.html">
                        Login
                    </a>

                </div>

            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/reset-password.js"></script>

</body>

</html>
