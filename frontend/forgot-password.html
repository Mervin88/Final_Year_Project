<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EventSync - Forgot Password</title>

    <link rel="stylesheet" href="css/forgot-password.css">
</head>

<body>

    <div class="login-container">

        <!-- LEFT PANEL -->
        <div class="login-left">

            <div class="left-content">

                <div class="logo">
                    ES
                </div>

                <h1>EventSync</h1>

                <p>
                    Centralized platform for seamless corporate
                    event coordination, venue discovery and
                    planning experience.
                </p>

                <div class="feature-list">

                    <div class="feature-item">
                        ✓ Secure Account Retrieval
                    </div>

                    <div class="feature-item">
                        ✓ Dynamic Password Resets
                    </div>

                    <div class="feature-item">
                        ✓ Two-way Data Security
                    </div>

                </div>

            </div>

        </div>

        <!-- RIGHT PANEL -->
        <div class="login-right">

            <div class="login-card">

                <h2>Reset Password</h2>

                <p class="subtitle">
                    Enter your email address to request a reset link.
                </p>

                <form id="forgotForm">

                    <div class="input-group">

                        <label for="email">Email Address</label>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            required>

                    </div>

                    <button type="submit">
                        Send Reset Link
                    </button>

                </form>

                <div class="bottom-text">

                    Back to login?
                    <a href="login.html">
                        Login
                    </a>

                </div>

            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/forgot-password.js"></script>

</body>

</html>
